version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 1
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @n8n/node-cli is exact-pinned: it carries n8n's lint rules for verification, so a new
      # version can change what passes. Take it by hand after reading the changelog.
      - dependency-name: "@n8n/node-cli"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # typescript stays on 5: the n8n starter pins it, and typescript-eslint (8.72.1) peers
      # typescript <6.1.0. Lift when both allow a newer major. (eslint 10 was taken 2026-11-04:
      # `n8n-node lint` runs the project's own eslint, and lint passes on 10.)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 1
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
