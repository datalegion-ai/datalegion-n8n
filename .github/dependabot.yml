version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 1
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @n8n/node-cli is exact-pinned: it carries n8n's lint rules for verification, so a new
      # version can change what passes. Take it by hand after reading the changelog.
      - dependency-name: "@n8n/node-cli"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # eslint and typescript move with @n8n/node-cli. `n8n-node lint` runs the eslint node-cli
      # depends on (9.29.0 in 0.55.4), so a top-level eslint 10 would install beside it unused;
      # lift when node-cli itself depends on eslint 10. TypeScript: the n8n starter pins 5.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 1
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
