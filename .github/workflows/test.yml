name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    # GitHub-hosted: the repo is public, and publish.yml needs a GitHub-hosted runner for provenance.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # n8n's image ships Node 26 (26.12.1 in n8nio/n8n:latest); the step below keeps its engines floor, 24.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # n8n's own linter: the rules n8n checks before verifying a community node.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Live tests call the production API; a fork's PR has no secret and fails them, so a
      # maintainer re-runs after review.
      - name: Test (unit + live API)
        env:
          DATALEGION_API_KEY: ${{ secrets.DATALEGION_API_KEY }}
        run: npm test

      # n8n's engines floor is Node 24 (>=24.0.0), which self-hosted instances may still run.
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test on Node 24 (unit + live API)
        env:
          DATALEGION_API_KEY: ${{ secrets.DATALEGION_API_KEY }}
        run: npm test
