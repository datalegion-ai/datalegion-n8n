# Publishes the package to npm when a vX.Y.Z tag is pushed. n8n only verifies community nodes
# published from GitHub Actions with an npm provenance statement, so this is the only way a
# release reaches npm (`prepublishOnly` refuses a publish from anywhere else).
#
# Auth: npm Trusted Publishing (OIDC), no token. npm trusts this repo, this workflow and the
# `npm` environment, which only v*.*.* tags can deploy to; only repo admins can push those tags.
# The package refuses token publishes.

name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Never cancel a publish mid-upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # Provenance needs a GitHub-hosted runner.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Node 26, the Node n8n's image runs; its npm (12) has the trusted publishing it needs (11.5.1+).
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test (unit + live API)
        env:
          DATALEGION_API_KEY: ${{ secrets.DATALEGION_API_KEY }}
        run: npm test

      # In CI, `n8n-node release` lints, builds and runs `npm publish` with provenance.
      - name: Publish
        run: npm run release
